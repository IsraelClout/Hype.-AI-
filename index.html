<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hype.AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="auth" class="card">

  <h1>⚡ Hype<span>.AI</span></h1>

  <p>Your intelligent AI companion.</p>

  <input id="name" placeholder="Your name">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Create Account</button>

  <button class="secondary" onclick="login()">
    Login
  </button>

  <small id="authMsg"></small>

</div>


<div id="app" class="hidden">

  <header class="glass">

    <div>
      <b>⚡ Hype.AI</b>
      <small> 🟢 Online</small>
    </div>

    <div>
      <button onclick="newChat()">＋</button>
      <button onclick="logout()">Logout</button>
    </div>

  </header>


  <main id="chat">

    <div class="welcome">
      <div class="logo">H</div>

      <h2>
        Hey <span id="username"></span> 👋
      </h2>

      <p>
        Ask Hype.AI anything.
      </p>

      <div class="suggestions">

        <button onclick="ask('Explain artificial intelligence')">
          🤖 Explain AI
        </button>

        <button onclick="ask('What is happening in Ghana today?')">
          🌍 Ghana today
        </button>

        <button onclick="ask('Teach me JavaScript')">
          💻 Teach me JavaScript
        </button>

        <button onclick="ask('Give me a technology business idea')">
          💡 Business idea
        </button>

      </div>
    </div>

  </main>


  <footer>

    <form onsubmit="send(event)" class="glass input">

      <textarea
        id="message"
        placeholder="Message Hype.AI..."
        rows="1"
      ></textarea>

      <button type="button" onclick="voiceInput()">🎙️</button>

      <button type="submit">➤</button>

    </form>

    <small>
      © 2026 Developed by Gokah Israel Ewoenam • 0537254505
    </small>

  </footer>

</div>

<script src="app.js"></script>

</body>
</html>
