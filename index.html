<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Hype.AI - Your intelligent AI assistant"
  >

  <title>Hype.AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================= -->
  <!-- AUTH SCREEN -->
  <!-- ============================= -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-card glass">

      <div class="logo">H</div>

      <h1>Hype<span>.AI</span></h1>

      <p class="subtitle">
        Your intelligent AI assistant.
      </p>

      <div class="auth-tabs">
        <button
          id="loginTab"
          class="auth-tab active"
        >
          Login
        </button>

        <button
          id="signupTab"
          class="auth-tab"
        >
          Sign Up
        </button>
      </div>

      <!-- LOGIN -->

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email address"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
        >

        <button
          type="submit"
          class="primary-btn"
        >
          Login
        </button>

      </form>

      <!-- SIGN UP -->

      <form
        id="signupForm"
        class="hidden"
      >

        <input
          id="signupName"
          type="text"
          placeholder="Your name"
          required
        >

        <input
          id="signupEmail"
          type="email"
          placeholder="Email address"
          required
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Create password"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="primary-btn"
        >
          Create Account
        </button>

      </form>

      <p id="authMessage" class="auth-message"></p>

      <small>
        Hype.AI • Intelligent • Fast • Friendly
      </small>

    </div>

  </section>


  <!-- ============================= -->
  <!-- MAIN APP -->
  <!-- ============================= -->

  <main id="appScreen" class="app hidden">

    <!-- HEADER -->

    <header class="topbar glass">

      <div class="brand">

        <div class="small-logo">
          H
        </div>

        <div>
          <strong>Hype.AI</strong>

          <span>
            AI Assistant
          </span>
        </div>

      </div>

      <div class="top-actions">

        <button
          id="newChatBtn"
          title="New chat"
        >
          ＋
        </button>

        <button
          id="logoutBtn"
          title="Logout"
        >
          ↪
        </button>

      </div>

    </header>


    <!-- WELCOME -->

    <section
      id="welcome"
      class="welcome"
    >

      <div class="big-logo">
        H
      </div>

      <h2>
        Hey <span id="userName">there</span> 👋
      </h2>

      <p>
        Ask Hype.AI anything.
      </p>

      <!-- QUICK PROMPTS -->

      <div class="quick-prompts">

        <button
          class="quick-prompt"
          data-prompt="Explain artificial intelligence in simple words."
        >
          🤖 Explain AI
        </button>

        <button
          class="quick-prompt"
          data-prompt="What are the latest important news in Ghana today?"
        >
          🌍 Ghana today
        </button>

        <button
          class="quick-prompt"
          data-prompt="Teach me JavaScript from beginner level."
        >
          💻 Teach me JavaScript
        </button>

        <button
          class="quick-prompt"
          data-prompt="Give me a profitable technology business idea for Ghana."
        >
          💡 Business idea
        </button>

      </div>

    </section>


    <!-- CHAT -->

    <section
      id="chatBox"
      class="chat-box"
    ></section>


    <!-- INPUT -->

    <div class="input-area glass">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message Hype.AI..."
      ></textarea>

      <button
        id="micBtn"
        class="icon-btn"
        title="Voice input"
      >
        🎙️
      </button>

      <button
        id="sendBtn"
        class="send-btn"
        title="Send"
      >
        ➤
      </button>

    </div>


    <footer>
      Hype.AI • Built with Mistral + Tavily
    </footer>

  </main>


  <script src="app.js"></script>

</body>
</html>
